name: Release
on:
  push:
    branches: [main]
concurrency: ${{ github.workflow }}-${{ github.ref }}
permissions:
  contents: write
  pull-requests: write
  # npm provenance: the published version names the commit and workflow that built it.
  id-token: write
jobs:
  # With pending changesets, opens or updates the "Version packages" PR. Once
  # that PR is merged, there are none left and the new version is published.
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Install development dependencies
        run: npm ci --no-fund --no-audit
      - name: Check the package as users install it
        run: node scripts/check-package.ts
      # v2 reads what `changeset publish` (Changesets v3) records in the file
      # CHANGESETS_OUTPUT names, and pushes the tag and the GitHub release from
      # it; v1 parsed v2's console output and found nothing to tag.
      - uses: changesets/action@v2
        with:
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          version-script: npm run version-packages
          publish-script: npm run release
        env:
          # setup-node's .npmrc, which npm reads, takes the token from here.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
