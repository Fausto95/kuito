<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Native modules: one TypeScript spec, a Swift class and a Kotlin class">
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#101b2c"/><stop offset="1" stop-color="#09111e"/></linearGradient>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8ba4bd" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="1" y="1" width="1198" height="438" rx="24" fill="url(#bg)" stroke="#2b3d51" stroke-width="2"/>
  <text x="46" y="51" font-size="12" letter-spacing="2.5" fill="#70b9ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-weight="700">07  /  NATIVE MODULES</text>
  <text x="46" y="88" font-size="29" font-weight="700" fill="#f2f7ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif">One spec, two platforms, linked by id</text>
  <text x="46" y="116" font-size="15" fill="#a8b8cd" font-family="Inter, ui-sans-serif, system-ui, sans-serif">The compiler reads the spec without running it and keeps a stub per function the app calls; the shells link the native classes.</text>

  <rect x="45" y="150" width="330" height="230" rx="16" fill="#16253a" stroke="#7bb8ff" stroke-opacity=".55" stroke-width="1.5"/>
  <rect x="65" y="169" rx="9" width="138" height="26" fill="#6dbdff" fill-opacity=".12" stroke="#6dbdff" stroke-opacity=".3"/><text x="76" y="187" font-size="12" font-weight="650" fill="#6dbdff" font-family="Inter, ui-sans-serif, system-ui, sans-serif">TYPESCRIPT SPEC</text>
  <text x="66" y="228" font-size="19" font-weight="700" fill="#f4f9ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif">defineModule('Haptics', …)</text>
  <text x="66" y="262" font-size="14" font-weight="500" fill="#c5d4e4" font-family="Inter, ui-sans-serif, system-ui, sans-serif">fn: functions the app calls</text>
  <text x="66" y="288" font-size="14" font-weight="500" fill="#c5d4e4" font-family="Inter, ui-sans-serif, system-ui, sans-serif">live: signals the platform updates</text>
  <text x="66" y="314" font-size="14" font-weight="500" fill="#c5d4e4" font-family="Inter, ui-sans-serif, system-ui, sans-serif">view: a native view for JSX</text>
  <text x="66" y="352" font-size="13" font-weight="550" fill="#87c3ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Types the app sees; read, not run</text>

  <path d="M381 265 L414 265" stroke="#8ba4bd" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>

  <rect x="422" y="150" width="330" height="230" rx="16" fill="#16253a" stroke="#c7a8ff" stroke-opacity=".55" stroke-width="1.5"/>
  <rect x="442" y="169" rx="9" width="100" height="26" fill="#baa5ff" fill-opacity=".12" stroke="#baa5ff" stroke-opacity=".3"/><text x="453" y="187" font-size="12" font-weight="650" fill="#baa5ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif">BUILD + LINK</text>
  <text x="443" y="228" font-size="19" font-weight="700" fill="#f4f9ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif">A stub per called function</text>
  <text x="443" y="262" font-size="14" font-weight="500" fill="#c5d4e4" font-family="Inter, ui-sans-serif, system-ui, sans-serif">The bundle keeps only what it uses</text>
  <text x="443" y="288" font-size="14" font-weight="500" fill="#c5d4e4" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Link table by module id</text>
  <text x="443" y="314" font-size="14" font-weight="500" fill="#c5d4e4" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Shells generated by the CLI</text>
  <text x="443" y="352" font-size="13" font-weight="550" fill="#c7a8ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif">No native project in the app</text>

  <path d="M758 265 L791 265" stroke="#8ba4bd" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>

  <rect x="799" y="150" width="356" height="230" rx="16" fill="#16253a" stroke="#7edec0" stroke-opacity=".55" stroke-width="1.5"/>
  <rect x="819" y="169" rx="9" width="112" height="26" fill="#7edec0" fill-opacity=".12" stroke="#7edec0" stroke-opacity=".3"/><text x="830" y="187" font-size="12" font-weight="650" fill="#7edec0" font-family="Inter, ui-sans-serif, system-ui, sans-serif">NATIVE CODE</text>
  <text x="820" y="228" font-size="19" font-weight="700" fill="#f4f9ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Swift class · Kotlin class</text>
  <text x="820" y="262" font-size="14" font-weight="500" fill="#c5d4e4" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Same members as the spec</text>
  <text x="820" y="288" font-size="14" font-weight="500" fill="#c5d4e4" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Calls cross in the host batch</text>
  <text x="820" y="314" font-size="14" font-weight="500" fill="#c5d4e4" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Permissions asked natively</text>
  <text x="820" y="352" font-size="13" font-weight="550" fill="#a0efda" font-family="Inter, ui-sans-serif, system-ui, sans-serif">haptics, location, storage… are built this way</text>

  <text x="46" y="415" font-size="13" font-weight="550" fill="#a7dcff" font-family="Inter, ui-sans-serif, system-ui, sans-serif">A module lands on both platforms in the same change, or its docs say which platform lacks it.</text>
</svg>
